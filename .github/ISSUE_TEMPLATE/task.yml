name: 任务卡
description: 一张可分配、可验收的开发任务
title: "[编号] 标题"
labels: []
body:
  - type: input
    id: id
    attributes: { label: 编号, placeholder: S2 }
    validations: { required: true }
  - type: dropdown
    id: stream
    attributes:
      label: 所属线
      options: [server, client, arch, ops]
    validations: { required: true }
  - type: dropdown
    id: milestone
    attributes:
      label: 里程碑
      options: [M0, M1, M2, M3, M4, M5]
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: 目标 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 允许修改的文件 / 目录 }
    validations: { required: true }
  - type: textarea
    id: forbidden
    attributes: { label: 不许修改 }
  - type: textarea
    id: acceptance
    attributes: { label: 验收标准（可测试） }
    validations: { required: true }
  - type: input
    id: depends
    attributes: { label: 依赖, placeholder: ARC-00 }
  - type: input
    id: estimate
    attributes: { label: 预计天数 }
