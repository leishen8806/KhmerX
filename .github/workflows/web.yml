name: Web gates

on:
  pull_request:
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMPDIR: ${{ runner.temp }}
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build separated artifacts
        run: npm run build:separated
      - name: Preserve generated artifacts outside source lint scope
        run: mv dist-separated "$RUNNER_TEMP/web-dist-separated"
      - name: Lint
        run: npm run lint
