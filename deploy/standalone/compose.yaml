services:
  payease:
    build:
      context: ../..
      dockerfile: deploy/standalone/Dockerfile
    user: "node"
    group_add:
      - "65534"
    restart: unless-stopped
    depends_on:
      scanner:
        condition: service_healthy
    ports:
      - "127.0.0.1:4300:4300"
    volumes:
      - /opt/payease/data:/data
      - /opt/payease/scanner-secrets:/run/scanner-secrets
    environment:
      SCANNER_TOKEN_PATH: /run/scanner-secrets/scanner-token
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  scanner:
    build: ../clamav-gateway
    restart: unless-stopped
    environment:
      # Use the healthy, independently managed ClamAV service.  The local
      # standalone clamd was repeatedly OOM-killed on the 4 GB VPS, leaving
      # every KYC upload with a scanner-unavailable error.
      CLAMD_HOST: oa-system-clamav-1
      CLAMD_PORT: "3310"
      SCAN_TOKEN_FILE: /run/scanner-secrets/scanner-token
    volumes:
      - /opt/payease/data:/data:ro
      - /opt/payease/scanner-secrets:/run/scanner-secrets:ro
    networks:
      - default
      - oa
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  # Keep the existing standalone network so the payease service can reach
  # scanner by its service name.
  default:
    name: standalone_default
  oa:
    external: true
    name: oa-system_default
