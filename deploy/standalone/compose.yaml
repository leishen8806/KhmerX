services:
  payease:
    build:
      context: ../..
      dockerfile: deploy/standalone/Dockerfile
    restart: unless-stopped
    depends_on:
      scanner:
        condition: service_healthy
    ports:
      - "127.0.0.1:4300:4300"
    volumes:
      - /opt/payease/data:/data
      - /opt/payease/scanner-secrets:/run/scanner-secrets
    environment:
      SCANNER_TOKEN_PATH: /run/scanner-secrets/scanner-token
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - /opt/payease/clamav:/var/lib/clamav
    # ClamAV loads the full signature database into memory; 768 MB causes
    # clamd to be OOM-killed during startup on the production VPS.
    mem_limit: 1536m
    expose:
      - "3310"
  scanner:
    build: ../clamav-gateway
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_started
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      SCAN_TOKEN_FILE: /run/scanner-secrets/scanner-token
    volumes:
      - /opt/payease/data:/data:ro
      - /opt/payease/scanner-secrets:/run/scanner-secrets:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
