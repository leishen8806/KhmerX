services:
  api:
    image: ${PAYEASE_API_IMAGE:-khmerx-api:separation-amd64}
    restart: unless-stopped
    depends_on:
      scanner:
        condition: service_healthy
    expose:
      - "4300"
    volumes:
      - /opt/payease/data:/data
      - /opt/payease/scanner-secrets:/run/scanner-secrets
    environment:
      SCANNER_TOKEN_PATH: /run/scanner-secrets/scanner-token
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - separated

  client:
    image: ${PAYEASE_CLIENT_IMAGE:-khmerx-client:separation-amd64}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PAYEASE_API_UPSTREAM: http://api:4300
    ports:
      - "127.0.0.1:4310:80"
    mem_limit: 128m
    networks:
      - separated

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - /opt/payease/clamav:/var/lib/clamav
    # ClamAV loads the full signature database into memory; keep startup
    # fail-closed without repeatedly OOM-killing clamd.
    mem_limit: 1536m
    expose:
      - "3310"
    networks:
      - separated

  scanner:
    build: ../clamav-gateway
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_started
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      SCAN_TOKEN_FILE: /run/scanner-secrets/scanner-token
    volumes:
      - /opt/payease/data:/data:ro
      - /opt/payease/scanner-secrets:/run/scanner-secrets:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - separated

networks:
  separated:
    name: payease-separated
