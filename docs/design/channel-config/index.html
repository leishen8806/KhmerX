<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KhmerX 渠道配置 UI 原型</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .field label{display:flex;flex-direction:column;gap:2px}.field-note{font-size:11px;font-weight:400;color:var(--muted-foreground);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.table td:last-child .button{white-space:nowrap;min-width:74px}.role-cards{display:none}.legacy-h5{background:#f4f7ff;border:0;border-radius:0;box-shadow:none;padding:24px 20px}.legacy-h5-header{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:18px;color:var(--muted-foreground);font-size:11px}.legacy-brand{display:flex;align-items:center;gap:8px;color:#173d91;font-size:20px}.legacy-logo{width:34px;height:34px;object-fit:contain;border-radius:9px}.legacy-test-banner{padding:10px 12px;border-radius:10px;background:#fff4d7;color:#925f00;font-size:12px;margin:12px 0 18px}.legacy-h5-card{padding:20px;background:#fff;border:1px solid #dce6f5;border-radius:18px;box-shadow:0 8px 26px #1720330b}.legacy-h5-card .field{margin-top:14px}.legacy-h5-card .button{margin-top:18px}.legacy-h5-foot{margin-top:32px;text-align:center;font-size:11px;color:var(--muted-foreground)}
    @media(max-width:760px){.role-table{display:none}.role-cards{display:grid;gap:10px}.role-card{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card)}.role-card h3{margin:0 0 8px}.role-card p{margin:4px 0;color:var(--muted-foreground)}.role-card strong{color:var(--foreground)}.table{min-width:0;table-layout:fixed}.table th:nth-child(n+4),.table td:nth-child(n+4){display:none}.table th:last-child,.table td:last-child{display:table-cell}.table th,.table td{padding:12px 8px}.table th:nth-child(1){width:36%}.table th:nth-child(2){width:22%}.table th:nth-child(3){width:26%}.table th:last-child{width:16%}.table td:last-child .button{min-width:0;width:auto;padding:7px 8px;font-size:12px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
