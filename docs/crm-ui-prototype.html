<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KhmerX CRM UI Prototype</title>
<style>
:root{--navy:#17253d;--blue:#276cf1;--bg:#f4f7fb;--line:#e2e8f2;--muted:#71809a;--green:#16a374;--red:#d84b4b;--card:#fff;--shadow:0 12px 28px #233b6610}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;height:100vh;min-height:0}.side{width:248px;background:#202d44;color:#cbd6e6;padding:22px 14px;position:fixed;inset:0 auto 0 0;height:100vh;overflow-y:auto;overscroll-behavior:contain;z-index:10}.brand{display:flex;gap:11px;align-items:center;padding:8px 13px 24px;border-bottom:1px solid #ffffff1c}.mark{width:36px;height:36px;border-radius:10px;background:#17c4c7;color:#10213b;display:grid;place-items:center;font-weight:800;font-size:20px}.brand b{display:block;color:#fff;font-size:16px}.brand small{font-size:10px;letter-spacing:1.5px;color:#93a7c4}.nav{padding-top:18px}.nav details{border-radius:9px;margin:2px 0}.nav summary{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:9px;color:#cbd6e6;cursor:pointer;list-style:none}.nav summary::-webkit-details-marker{display:none}.nav summary>span{display:flex;gap:10px;align-items:center}.nav summary:hover,.nav details[open]>summary{background:#344968;color:#fff}.nav summary i{font-style:normal;color:#9bb0c9}.subnav{padding:3px 0 5px 22px}.subnav button{width:100%;border:0;border-left:1px solid #ffffff2a;background:none;color:#abc0d8;text-align:left;padding:8px 12px;border-radius:0 7px 7px 0;cursor:pointer;font:inherit;font-size:12px;display:flex;justify-content:space-between}.subnav button:hover,.subnav button.active{background:#3d4d68;color:#fff}.foot{position:absolute;bottom:18px;padding:0 14px;color:#91a3c0;font-size:12px}.main{margin-left:248px;width:calc(100% - 248px);min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{height:70px;flex:0 0 70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:relative;z-index:5}.crumb{font-size:22px;font-weight:750}.crumb small{font-size:12px;color:var(--muted);font-weight:500;margin-left:12px}.top-actions{display:flex;align-items:center;gap:14px;color:var(--muted)}.env{background:#fff5d9;color:#a67513;padding:7px 11px;border-radius:8px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#eef3fb;display:grid;place-items:center;color:var(--blue);font-weight:700}.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:28px 34px 50px;max-width:1500px;width:100%;margin:0 auto;overscroll-behavior:contain}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.8px;margin:0}.title-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.title-row h1{margin:4px 0;font-size:30px}.subtitle{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}.kpi span,.muted{color:var(--muted)}.kpi strong{display:block;font-size:30px;margin:8px 0}.kpi.alert strong{color:var(--red)}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-title h2,.panel-title h3{margin:0;font-size:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:600;font-size:12px}.badge{display:inline-flex;padding:4px 8px;border-radius:99px;background:#edf3ff;color:#255fc5;font-size:12px}.badge.green{background:#e7f8f1;color:#11855f}.badge.red{background:#fff0f0;color:#bd3f3f}.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:13px;font:inherit}.list{display:grid;gap:8px}.row{padding:13px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:20px;background:#fff}.row b{font-size:13px}.timeline{display:grid;gap:12px}.timeline div{display:flex;gap:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:6px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{padding:12px;background:#f7f9fd;border-radius:9px;border-left:3px solid var(--line)}.step.done{border-left-color:var(--green)}.step.current{border-left-color:var(--blue)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font:inherit}.notice{padding:13px 15px;border-radius:10px;background:#fff6df;color:#8a6410}.page-index{display:none}@media(max-width:900px){.side{width:74px;padding:16px 8px}.brand span:not(.mark),.nav summary span span,.nav summary i,.foot{display:none}.brand{justify-content:center;padding-left:0;padding-right:0}.nav summary{justify-content:center}.main{margin-left:74px;width:calc(100% - 74px)}.top{padding:0 18px}.content{padding:22px 18px}.kpis,.two,.three{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two,.three{grid-template-columns:1fr}.crumb{font-size:18px}.top-actions .env{display:none}.steps{grid-template-columns:1fr 1fr}}
</style><style>
.filters select{padding-right:28px}.account{position:relative}.account summary{list-style:none;cursor:pointer}.account summary::-webkit-details-marker{display:none}.account-pop{position:absolute;right:0;top:44px;z-index:5;display:flex;min-width:220px;flex-direction:column;gap:7px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}.account-pop strong,.account-pop span{padding:0 4px}.account-pop span{font-size:12px;color:var(--muted)}.account-pop .btn{margin-top:4px;text-align:left}
</style>
<style>
.nav summary>span{gap:11px;min-width:0}.nav summary>span>span{white-space:nowrap}.nav summary i{font-size:0;line-height:1;transition:transform .18s ease}.nav summary i::after{content:'⌄';font-size:16px}.nav details[open]>summary i{transform:rotate(180deg)}
.nav-icon{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.subnav{padding-left:25px}.subnav button b{font-size:17px;font-weight:400;line-height:1}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><span class="mark">K</span><span><b>KhmerX</b><small>SERVICE OPERATIONS</small></span></div><nav class="nav" id="nav"></nav><div class="foot">测试资金环境<br>CRM OPERATIONS</div></aside><main class="main"><header class="top"><div class="crumb" id="crumb">工作台 <small>首页 / 今日概览</small></div><div class="top-actions"><span>🇨🇳</span><details class="account"><summary class="avatar">AD</summary><div class="account-pop"><strong>admin@khmerx.org</strong><span>所属公司：PayEase 测试公司</span><span>岗位：公司管理员</span><button class="btn">修改密码</button><button class="btn danger">退出登录</button></div></details></div></header><section class="content"><div class="title-row"><div><p class="eyebrow">CRM OPERATIONS</p><h1 id="title">今日概览</h1><p class="subtitle" id="subtitle">先看待办，再进入具体业务队列。</p></div><div><button class="btn">导出日报</button> <button class="btn primary">处理待办</button></div></div><div class="page-index" id="index"></div><div id="view"></div></section></main></div>
<script>
const groups={
 '工作台':['今日概览','我的待办','团队队列','SLA 与提醒','风险摘要'],
 '客户中心':['客户列表','客户 360° 详情','KYC 审核队列','待补件','客户标签与分组'],
 '业务中心':['贷款申请','审批协同','合同与签约','放款管理','账单与还款','提现与钱包','业务时间线'],
 '服务中心':['客服工单','补件任务','贷后任务','逾期与催收','投诉与争议','通知发送记录'],
 '风控与资金':['风控事件','资金监管','每日放款限额','每月放款限额','20% 资金预警','冻结与解除','资金流水','对账异常'],
 '产品与运营':['贷款产品','费率与费用','风控规则与版本','Telegram 业务渠道','通知模板','公司新闻','行业资讯','帮助中心'],
 '报表中心':['客户漏斗','KYC 与审批','放款与还款','逾期与催收','资金监管','客服与投诉','自定义报表'],
 '组织与系统':['公司与部门','员工与角色','数据范围','字段权限','持牌机构','API 应用','语言与时区','文件与扫描配置','系统健康'],
 '审计与安全':['操作审计','登录与 IP','数据修改','资金操作','权限变更','安全告警','应急事件','审计导出']};
const iconPaths={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',users:'<path d="M16 20v-1.5a4.5 4.5 0 0 0-4.5-4.5h-3A4.5 4.5 0 0 0 4 18.5V20"/><circle cx="10" cy="7" r="3"/><path d="M17 8a3 3 0 0 1 0 5.8M20 20v-1.5a4.5 4.5 0 0 0-2.7-4.1"/>',briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/>',headset:'<path d="M4 14v-3a8 8 0 0 1 16 0v3"/><path d="M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.7-1.8 3-4 3h-1"/>',shield:'<path d="M12 3 20 6v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>',wallet:'<path d="M4 6h15a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h15v4"/><path d="M16 13h5"/><circle cx="16" cy="13" r=".8"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 5-6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6v-2.6h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h2.6v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v2.6h-.1a1.7 1.7 0 0 0-1.6 1z"/>',audit:'<path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/><path d="m15 18 1.5 1.5L20 16"/>'};
const icons=['grid','users','briefcase','headset','shield','wallet','chart','settings','audit'];
function menuIcon(name){return `<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]}</svg>`}
let group='工作台',page='今日概览';
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function nav(){navEl.innerHTML=Object.keys(groups).map((g,i)=>`<details ${g===group?'open':''}><summary onclick="selectGroup('${g}')"><span>${menuIcon(icons[i])}<span>${g}</span></span><i>⌄</i></summary><div class="subnav">${groups[g].map(p=>`<button class="${g===group&&p===page?'active':''}" onclick="selectPage('${p}')"><span>${p}</span><b>›</b></button>`).join('')}</div></details>`).join('')}
function selectGroup(g){group=g;page=groups[g][0];render()}
function selectPage(p){page=p;render()}
function table(rows){return `<table class="table"><thead><tr><th>对象</th><th>状态</th><th>负责人</th><th>更新时间</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${r}</b><br><span class="muted">${i%2?'申请/资料版本':'当前权限范围'}</span></td><td><span class="badge ${i===3?'red':i===1?'green':''}">${i===3?'需关注':i===1?'已完成':'处理中'}</span></td><td>${i%2?'KYC 主管':'待分配'}</td><td>今天 09:${40+i}</td><td><button class="btn">查看</button></td></tr>`).join('')}</tbody></table>`}
function view(){
 const p=page;
 if(p==='今日概览')return `<div class="grid kpis">${[['待审 KYC','12','需审核或补件'],['待处理贷款','8','审批或待签约'],['在贷账户','36','当前活跃贷款'],['逾期案件','4','需要贷后跟进']].map((x,i)=>`<article class="card kpi ${i===3?'alert':''}"><span>${x[0]}</span><strong>${x[1]}</strong><small class="muted">${x[2]}</small></article>`).join('')}</div><div class="grid two" style="margin-top:18px"><article class="card"><div class="panel-title"><h2>资金监管 <span class="muted">今日实时</span></h2><span class="badge green">正常</span></div><p class="muted">已放款 $7,420 <span style="float:right">日限额 $10,000</span></p><div style="height:8px;background:#e9eef7;border-radius:8px"><div style="width:74%;height:100%;background:#3977ef;border-radius:8px"></div></div><p class="muted">月度使用 $18,650 <span style="float:right">月限额 $30,000</span></p><div style="height:8px;background:#e9eef7;border-radius:8px"><div style="width:62%;height:100%;background:#3977ef;border-radius:8px"></div></div><p class="notice">距资金预警线还剩 20% 额度，请保持人工复核。</p></article><article class="card"><div class="panel-title"><h2>最近操作</h2><span class="muted">保留完整审计轨迹</span></div><div class="timeline">${['KYC-24091 已补件','LOAN-1048 完成独立复核','员工权限已更新'].map((x,i)=>`<div><span class="dot"></span><span><b>${x}</b><br><small class="muted">${i?'昨天':'今天 09:42'}</small></span></div>`).join('')}</div></article></div>`;
 if(p==='客户 360° 详情')return `<div class="grid two"><article class="card"><div class="panel-title"><h2>客户资料</h2><span class="badge green">KYC 已通过</span></div><dl class="grid two"><div><span class="muted">客户 ID</span><br><b>CUST-20491</b></div><div><span class="muted">脱敏手机号</span><br><b>+855 ** 4812</b></div><div><span class="muted">KYC 版本</span><br><b>v4</b></div><div><span class="muted">所属机构</span><br><b>测试承接机构</b></div></dl><div class="steps" style="margin-top:18px"><div class="step done">注册<br><small>已完成</small></div><div class="step done">KYC<br><small>已通过</small></div><div class="step current">贷款<br><small>处理中</small></div><div class="step">贷后<br><small>待进入</small></div></div></article><article class="card"><div class="panel-title"><h2>业务时间线</h2><button class="btn">导出</button></div><div class="timeline">${['KYC 资料审核通过','贷款账单已确认','通知已发送'].map((x,i)=>`<div><span class="dot"></span><span><b>${x}</b><br><small class="muted">2026-10-07 09:${42-i*8}</small></span></div>`).join('')}</div></article></div><div class="card" style="margin-top:18px"><div class="panel-title"><h2>贷款与账单</h2><button class="btn primary">打开业务详情</button></div>${table(['LOAN-1048','LOAN-1032'])}</div>`;
 const rows=groups[group].slice(0,5);return `<article class="card"><div class="filters"><input placeholder="搜索 ID、手机号、状态或负责人" style="flex:1;min-width:220px"><select><option>全部状态</option><option>待处理</option><option>已完成</option></select><select><option>当前公司</option><option>当前部门</option><option>当前机构</option></select><button class="btn primary">查询</button></div><div class="panel-title"><h2>${esc(p)}</h2><span class="muted">当前范围 24 条记录</span></div>${table(rows)}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span class="muted">每页 20 条 · 数据操作均写入审计</span><button class="btn">下一页 ›</button></div></article>`;
}
function render(){nav();index.innerHTML=groups[group].map(x=>`<button class="${x===page?'active':''}" onclick="selectPage('${x}')">${x}</button>`).join('');crumb.innerHTML=`${group} <small>首页 / ${group} / ${page}</small>`;title.textContent=page;subtitle.textContent=page==='今日概览'?'先看待办，再进入具体业务队列。':'独立页面、独立权限、独立数据闭环。';viewEl.innerHTML=view()}
const navEl=document.getElementById('nav'),index=document.getElementById('index'),viewEl=document.getElementById('view'),crumb=document.getElementById('crumb'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle');render();
</script></body></html>
